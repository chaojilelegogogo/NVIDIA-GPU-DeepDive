<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d1f4d"/><stop offset="1" stop-color="#291433"/>
    </linearGradient>
    <linearGradient id="gpc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d2f7a"/><stop offset="1" stop-color="#47255c"/>
    </linearGradient>
    <linearGradient id="sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b59b6"/><stop offset="1" stop-color="#6f3a86"/>
    </linearGradient>
  </defs>
  <style>
    .title{font-size:20px;font-weight:700;fill:#efe6f5}
    .sub{font-size:12px;fill:#c3a6d1}
    .lbl{font-size:11px;fill:#f0eaf5;font-weight:600}
    .lbl2{font-size:10px;fill:#d6c3e2}
    .box-lab{font-size:12px;font-weight:700;text-anchor:middle}
    .cnt{font-size:13px;font-weight:700;text-anchor:middle}
  </style>

  <text x="20" y="30" class="title">NVIDIA H100 - GH100 (Hopper) - GPC / TPC / SM Topology</text>
  <text x="20" y="48" class="sub">Full die: 8 GPC x 18 SM = 144 SM; SXM5 enables 8 GPC x 132 SM. FP32 cores doubled to 128/SM.</text>

  <rect x="20" y="60" width="840" height="240" rx="8" fill="url(#die)" stroke="#8b5ba8" stroke-width="1.5"/>
  <text x="440" y="84" class="box-lab" fill="#efe6f5">GH100 GPU Die (TSMC 4N, 80B transistors)</text>

  <g><rect x="40" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="130" y="125" class="box-lab" fill="#fff">GPC 0</text></g>
  <g><rect x="234" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="324" y="125" class="box-lab" fill="#fff">GPC 1</text></g>
  <g><rect x="428" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="518" y="125" class="box-lab" fill="#fff">GPC 2</text></g>
  <g><rect x="622" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="712" y="125" class="box-lab" fill="#fff">GPC 3</text></g>
  <g><rect x="40" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="130" y="175" class="box-lab" fill="#fff">GPC 4</text></g>
  <g><rect x="234" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="324" y="175" class="box-lab" fill="#fff">GPC 5</text></g>
  <g><rect x="428" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="518" y="175" class="box-lab" fill="#fff">GPC 6</text></g>
  <g><rect x="622" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#a06ac0"/><text x="712" y="175" class="box-lab" fill="#fff">GPC 7</text></g>

  <rect x="40" y="206" width="180" height="76" rx="4" fill="#241330" stroke="#6f3a86"/>
  <text x="130" y="224" class="lbl" text-anchor="middle">GPC 0 expanded: TPC</text>
  <rect x="52" y="232" width="74" height="40" rx="4" fill="url(#sm)" stroke="#b06ac8"/><text x="89" y="257" class="cnt" fill="#fff">SM</text>
  <rect x="134" y="232" width="74" height="40" rx="4" fill="url(#sm)" stroke="#b06ac8"/><text x="171" y="257" class="cnt" fill="#fff">SM</text>
  <text x="130" y="247" class="lbl" fill="#f0eaf5" text-anchor="middle">1 TPC = 2 SM</text>

  <g transform="translate(240,206)">
    <rect x="0" y="0" width="300" height="76" rx="4" fill="#1c0f28" stroke="#6f3a86"/>
    <text x="12" y="18" class="lbl">GPC = GPU Processing Cluster</text>
    <text x="12" y="34" class="lbl">TPC = Texture Processing Cluster (2 SM)</text>
    <text x="12" y="50" class="lbl">New: Thread Block Cluster (cross-SM)</text>
    <text x="12" y="68" class="lbl2">8 GPC x 66 TPC = 132 SM (528 Tensor Cores)</text>
  </g>

  <g transform="translate(560,206)">
    <rect x="0" y="0" width="240" height="76" rx="4" fill="#1c0f28" stroke="#6f3a86"/>
    <text x="12" y="18" class="lbl">Chip-level shared / new HW:</text>
    <text x="12" y="34" class="lbl">- L2 50 MB, HBM3 3.35 TB/s</text>
    <text x="12" y="50" class="lbl">- TMA: tensor DMA engine</text>
    <text x="12" y="68" class="lbl">- Transformer Engine (FP8)</text>
  </g>

  <text x="20" y="340" class="title">SM internals (Hopper: 128 FP32 + 64 INT32 + 64 FP64 cores, 4 Tensor Cores)</text>
  <text x="20" y="358" class="sub">Key changes vs A100: FP32 lanes 64 to 128/SM; 4th-gen Tensor Core (FP8 + WGMMA); TMA + mbarrier.</text>

  <rect x="20" y="372" width="840" height="356" rx="8" fill="url(#sm)" stroke="#b06ac8" stroke-width="1.5"/>
  <text x="440" y="396" class="box-lab" fill="#fff">Streaming Multiprocessor (SM) - Hopper GH100</text>

  <g transform="translate(40,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#2a1740" stroke="#9b6ac0"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 0</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x32</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#e74c8b"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#fff">TC4x1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x16</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(240,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#2a1740" stroke="#9b6ac0"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 1</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x32</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#e74c8b"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#fff">TC4x1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x16</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(440,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#2a1740" stroke="#9b6ac0"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 2</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x32</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#e74c8b"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#fff">TC4x1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x16</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(640,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#2a1740" stroke="#9b6ac0"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 3</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x32</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#e74c8b"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#fff">TC4x1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x16</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>

  <g transform="translate(40,622)">
    <rect x="0" y="0" width="790" height="88" rx="6" fill="#3a2f4d" stroke="#9b6ac0" stroke-width="1.5"/>
    <text x="20" y="22" class="lbl" fill="#fff">SM-level shared (Hopper adds TMA / DSM):</text>
    <rect x="20" y="32" width="230" height="42" rx="4" fill="#5a4a80"/><text x="135" y="50" class="lbl2" text-anchor="middle" fill="#fff">L1 + Shared Memory</text><text x="135" y="64" class="lbl2" text-anchor="middle" fill="#fff">256 KB unified SRAM</text>
    <rect x="262" y="32" width="230" height="42" rx="4" fill="#6f2d5a"/><text x="377" y="50" class="lbl2" text-anchor="middle" fill="#fff">TMA unit</text><text x="377" y="64" class="lbl2" text-anchor="middle" fill="#fff">(async tensor DMA, 1-thread)</text>
    <rect x="504" y="32" width="270" height="42" rx="4" fill="#6f2d5a"/><text x="639" y="50" class="lbl2" text-anchor="middle" fill="#fff">DSM: cross-SM SMEM access</text><text x="639" y="64" class="lbl2" text-anchor="middle" fill="#fff">within a Cluster</text>
  </g>

  <text x="20" y="744" class="sub">Note: H100 is a fully-asynchronous GPU - TMA (move) + WGMMA (compute) + mbarrier (async barrier).</text>
</svg>