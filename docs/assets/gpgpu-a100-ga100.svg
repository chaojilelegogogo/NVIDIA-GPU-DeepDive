<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/><stop offset="1" stop-color="#14263e"/>
    </linearGradient>
    <linearGradient id="gpc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5d8a"/><stop offset="1" stop-color="#24476b"/>
    </linearGradient>
    <linearGradient id="sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a2a0"/><stop offset="1" stop-color="#0f7a78"/>
    </linearGradient>
  </defs>
  <style>
    .title{font-size:20px;font-weight:700;fill:#e8eef5}
    .sub{font-size:12px;fill:#9fb3c8}
    .lbl{font-size:11px;fill:#dfe7ef;font-weight:600}
    .lbl2{font-size:10px;fill:#b6c6d8}
    .box-lab{font-size:12px;font-weight:700;text-anchor:middle}
    .cnt{font-size:13px;font-weight:700;text-anchor:middle}
  </style>

  <text x="20" y="30" class="title">NVIDIA A100 - GA100 (Ampere) - GPC / TPC / SM Topology</text>
  <text x="20" y="48" class="sub">Full die: 8 GPC x 16 SM = 128 SM; production A100 enables 7 GPC x 108 SM. SM = Streaming Multiprocessor (1 Block occupies 1 SM).</text>

  <rect x="20" y="60" width="840" height="240" rx="8" fill="url(#die)" stroke="#4a6f9c" stroke-width="1.5"/>
  <text x="440" y="84" class="box-lab" fill="#e8eef5">GA100 GPU Die (TSMC 7nm, 54.2B transistors)</text>

  <g><rect x="40" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="130" y="125" class="box-lab" fill="#fff">GPC 0</text></g>
  <g><rect x="234" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="324" y="125" class="box-lab" fill="#fff">GPC 1</text></g>
  <g><rect x="428" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="518" y="125" class="box-lab" fill="#fff">GPC 2</text></g>
  <g><rect x="622" y="100" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="712" y="125" class="box-lab" fill="#fff">GPC 3</text></g>
  <g><rect x="40" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="130" y="175" class="box-lab" fill="#fff">GPC 4</text></g>
  <g><rect x="234" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="324" y="175" class="box-lab" fill="#fff">GPC 5</text></g>
  <g><rect x="428" y="150" width="180" height="40" rx="6" fill="url(#gpc)" stroke="#66a0d0"/><text x="518" y="175" class="box-lab" fill="#fff">GPC 6</text></g>
  <g><rect x="622" y="150" width="180" height="40" rx="6" fill="none" stroke="#7a8ea8" stroke-dasharray="4 3"/><text x="712" y="175" class="box-lab" fill="#7a8ea8">GPC 7 (disabled)</text></g>

  <rect x="40" y="206" width="180" height="76" rx="4" fill="#16304c" stroke="#35618f"/>
  <text x="130" y="224" class="lbl" text-anchor="middle">GPC 0 expanded: 8 TPC</text>
  <rect x="52" y="232" width="74" height="40" rx="4" fill="url(#sm)" stroke="#3fcfcc"/><text x="89" y="257" class="cnt" fill="#fff">SM</text>
  <rect x="134" y="232" width="74" height="40" rx="4" fill="url(#sm)" stroke="#3fcfcc"/><text x="171" y="257" class="cnt" fill="#fff">SM</text>
  <text x="130" y="247" class="lbl" fill="#dff" text-anchor="middle">1 TPC = 2 SM</text>

  <g transform="translate(240,206)">
    <rect x="0" y="0" width="300" height="76" rx="4" fill="#0e2035" stroke="#35618f"/>
    <text x="12" y="18" class="lbl">GPC = GPU Processing Cluster</text>
    <text x="12" y="34" class="lbl">TPC = Texture Processing Cluster (2 SM)</text>
    <text x="12" y="50" class="lbl">SM = smallest schedulable unit (Block to SM)</text>
    <text x="12" y="68" class="lbl2">7 GPC x 16 SM = 108 SM (432 Tensor Cores)</text>
  </g>

  <g transform="translate(560,206)">
    <rect x="0" y="0" width="240" height="76" rx="4" fill="#0e2035" stroke="#35618f"/>
    <text x="12" y="18" class="lbl">Chip-level shared:</text>
    <text x="12" y="34" class="lbl">- L2 Cache: 40 MB</text>
    <text x="12" y="50" class="lbl">- 6 x HBM2e stack (5120-bit)</text>
    <text x="12" y="68" class="lbl">- Bandwidth 2.04 TB/s</text>
  </g>

  <text x="20" y="340" class="title">SM internals (each SM = 4 Processing Blocks / Partitions)</text>
  <text x="20" y="358" class="sub">Per SM: 64 FP32 + 64 INT32 + 32 FP64 CUDA Cores, 4 Tensor Cores, 4 SFU, 192 KB L1/SMEM, 256 KB Register File.</text>

  <rect x="20" y="372" width="840" height="356" rx="8" fill="url(#sm)" stroke="#3fcfcc" stroke-width="1.5"/>
  <text x="440" y="396" class="box-lab" fill="#fff">Streaming Multiprocessor (SM) - Ampere GA100</text>

  <g transform="translate(40,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#0e2c2a" stroke="#2fb8b6"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 0</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x16</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#f0a24a"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#411">TCx1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x8</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(240,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#0e2c2a" stroke="#2fb8b6"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 1</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x16</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#f0a24a"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#411">TCx1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x8</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(440,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#0e2c2a" stroke="#2fb8b6"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 2</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x16</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#f0a24a"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#411">TCx1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x8</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>
  <g transform="translate(640,412)">
    <rect x="0" y="0" width="190" height="200" rx="6" fill="#0e2c2a" stroke="#2fb8b6"/>
    <text x="95" y="20" class="lbl" text-anchor="middle">Partition 3</text>
    <rect x="12" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="39" y="47" class="lbl2" text-anchor="middle" fill="#062">FP32x16</text>
    <rect x="70" y="30" width="54" height="26" rx="3" fill="#5bc98c"/><text x="97" y="47" class="lbl2" text-anchor="middle" fill="#062">INT32x16</text>
    <rect x="128" y="30" width="54" height="26" rx="3" fill="#f0a24a"/><text x="155" y="47" class="lbl2" text-anchor="middle" fill="#411">TCx1</text>
    <rect x="12" y="62" width="54" height="26" rx="3" fill="#7f7fb0"/><text x="39" y="79" class="lbl2" text-anchor="middle" fill="#fff">FP64x8</text>
    <rect x="70" y="62" width="54" height="26" rx="3" fill="#4aa3e0"/><text x="97" y="79" class="lbl2" text-anchor="middle" fill="#fff">LD/ST</text>
    <rect x="128" y="62" width="54" height="26" rx="3" fill="#c881c8"/><text x="155" y="79" class="lbl2" text-anchor="middle" fill="#411">SFU</text>
    <rect x="12" y="94" width="170" height="24" rx="3" fill="#274e6b"/><text x="97" y="110" class="lbl2" text-anchor="middle">Warp Scheduler + Dispatch</text>
    <rect x="12" y="124" width="170" height="60" rx="3" fill="#3a2f4d"/><text x="97" y="140" class="lbl2" text-anchor="middle" fill="#fff">Register File</text><text x="97" y="154" class="lbl2" text-anchor="middle" fill="#fff">16K x 32-bit (64 KB)</text>
  </g>

  <g transform="translate(40,622)">
    <rect x="0" y="0" width="790" height="88" rx="6" fill="#3a2f4d" stroke="#8a7bb8" stroke-width="1.5"/>
    <text x="20" y="22" class="lbl" fill="#fff">SM-level shared resources:</text>
    <rect x="20" y="32" width="240" height="42" rx="4" fill="#5a4a80"/><text x="140" y="50" class="lbl2" text-anchor="middle" fill="#fff">L1 Data Cache</text><text x="140" y="64" class="lbl2" text-anchor="middle" fill="#fff">+ Shared Memory (unified)</text>
    <rect x="275" y="32" width="240" height="42" rx="4" fill="#5a4a80"/><text x="395" y="50" class="lbl2" text-anchor="middle" fill="#fff">192 KB unified SRAM</text><text x="395" y="64" class="lbl2" text-anchor="middle" fill="#fff">(L1/SMEM split)</text>
    <rect x="530" y="32" width="240" height="42" rx="4" fill="#5a4a80"/><text x="650" y="50" class="lbl2" text-anchor="middle" fill="#fff">Register File 256 KB</text><text x="650" y="64" class="lbl2" text-anchor="middle" fill="#fff">max 2048 threads/SM</text>
  </g>

  <text x="20" y="744" class="sub">Note: A100 has no TMA/async engine; 3rd-gen Tensor Core (TF32/BF16/FP16/INT8/INT4, 2:4 structured sparsity).</text>
</svg>