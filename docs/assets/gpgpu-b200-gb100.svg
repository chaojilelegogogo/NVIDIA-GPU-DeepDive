  <g transform="translate(40,624)">
    <rect x="0" y="0" width="790" height="86" rx="6" fill="#3a2f4d" stroke="#4fc08a" stroke-width="1.5"/>
    <text x="20" y="22" class="lbl" fill="#fff">SM-level shared (Blackwell adds TMEM / CTA Pair):</text>
    <rect x="20" y="32" width="180" height="42" rx="4" fill="#5a4a80"/><text x="110" y="50" class="lbl2" text-anchor="middle" fill="#fff">L1 + Shared Memory</text><text x="110" y="64" class="lbl2" text-anchor="middle" fill="#fff">256 KB unified SRAM</text>
    <rect x="212" y="32" width="180" height="42" rx="4" fill="#7a3b5e"/><text x="302" y="50" class="lbl2" text-anchor="middle" fill="#fff">TMEM 256 KB/SM</text><text x="302" y="64" class="lbl2" text-anchor="middle" fill="#fff">128 Lane x 512 col, accumulator</text>
    <rect x="404" y="32" width="180" height="42" rx="4" fill="#7a3b5e"/><text x="494" y="50" class="lbl2" text-anchor="middle" fill="#fff">tcgen05 instruction family</text><text x="494" y="64" class="lbl2" text-anchor="middle" fill="#fff">alloc/mma/ld/st/commit</text>
    <rect x="596" y="32" width="180" height="42" rx="4" fill="#6f2d5a"/><text x="686" y="50" class="lbl2" text-anchor="middle" fill="#fff">CTA Pair (within TPC)</text><text x="686" y="64" class="lbl2" text-anchor="middle" fill="#fff">2 SMs share TC operands</text>
  </g>

  <text x="20" y="744" class="sub">Note: B200 SM has 4 partitions, 4x 5th-gen Tensor Cores and a dedicated TMEM (128 Lane x 512 col x 32-bit ~= 256 KB) as accumulator storage.</text>
</svg>