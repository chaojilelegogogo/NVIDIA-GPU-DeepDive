<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/><stop offset="1" stop-color="#0a2a20"/>
    </linearGradient>
    <linearGradient id="gpc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7d4f"/><stop offset="1" stop-color="#1e5c38"/>
    </linearGradient>
    <linearGradient id="sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23a06b"/><stop offset="1" stop-color="#157a4e"/>
    </linearGradient>
  </defs>
  <style>
    .title{font-size:20px;font-weight:700;fill:#e6f5ee}
    .sub{font-size:12px;fill:#a6d1bd}
    .lbl{font-size:11px;fill:#eef7f2;font-weight:600}
    .lbl2{font-size:10px;fill:#cbe6d9}
    .box-lab{font-size:12px;font-weight:700;text-anchor:middle}
    .cnt{font-size:13px;font-weight:700;text-anchor:middle}
  </style>

  <text x="20" y="30" class="title">NVIDIA B200 - GB100 (Blackwell) - Dual-Die Topology (Chiplet)</text>
  <text x="20" y="48" class="sub">Two reticle-limit dies connected by NV-HBI (10 TB/s) on CoWoS-L; presented to CUDA as one GPU. 74 SM/die x 2 = 148 SM.</text>

  <rect x="20" y="60" width="840" height="270" rx="8" fill="url(#die)" stroke="#3f9c72" stroke-width="1.5"/>
  <text x="440" y="84" class="box-lab" fill="#e6f5ee">GB100 Dual-Die Package (TSMC 4NP, 208B transistors)</text>

  <rect x="330" y="96" width="220" height="198" rx="6" fill="#123f31" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="440" y="118" class="box-lab" fill="#a6d1bd">NV-HBI</text>
  <text x="440" y="136" class="box-lab" fill="#a6d1bd">10 TB/s</text>
  <text x="440" y="156" class="lbl2" text-anchor="middle">die-to-die interconnect</text>
  <text x="440" y="174" class="lbl2" text-anchor="middle">software-transparent, unified HBM</text>

  <rect x="40" y="96" width="280" height="198" rx="6" fill="#0a2a20" stroke="#3f9c72" stroke-width="1.5"/>
  <text x="180" y="118" class="box-lab" fill="#e6f5ee">Die 0 (GB100)</text>
  <text x="180" y="136" class="lbl2" text-anchor="middle">8 GPC, 74 SM</text>
  <g>
    <rect x="56" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="85" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="122" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="151" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="188" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="217" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="254" y="148" width="50" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="279" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="56" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="85" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="122" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="151" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="188" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="217" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="254" y="186" width="50" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="279" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <text x="180" y="236" class="lbl2" text-anchor="middle">8 GPC/die (x2 = 16 logical partitions)</text>
    <text x="180" y="250" class="lbl2" text-anchor="middle">74 SM/die, 4 L2 partitions/die</text>
    <text x="180" y="264" class="lbl2" text-anchor="middle">TMEM 256 KB/SM, 5th-gen TC</text>
  </g>

  <rect x="560" y="96" width="280" height="198" rx="6" fill="#0a2a20" stroke="#3f9c72" stroke-width="1.5"/>
  <text x="700" y="118" class="box-lab" fill="#e6f5ee">Die 1 (GB100)</text>
  <text x="700" y="136" class="lbl2" text-anchor="middle">8 GPC, 74 SM</text>
  <g>
    <rect x="576" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="605" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="642" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="671" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="708" y="148" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="737" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="774" y="148" width="50" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="799" y="168" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="576" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="605" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="642" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="671" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="708" y="186" width="58" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="737" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <rect x="774" y="186" width="50" height="30" rx="4" fill="url(#gpc)" stroke="#55b184"/><text x="799" y="206" class="lbl2" text-anchor="middle" fill="#fff">GPC</text>
    <text x="700" y="236" class="lbl2" text-anchor="middle">unified HBM3e 192 GB</text>
    <text x="700" y="250" class="lbl2" text-anchor="middle">8 TB/s bandwidth, 126 MB L2</text>
    <text x="700" y="264" class="lbl2" text-anchor="middle">NVLink 5.0: 1.8 TB/s</text>
  </g>

  <text x="20" y="362" class="title">Blackwell SM internals: TMEM (Tensor Memory) + 5th-gen Tensor Core</text>
  <text x="20" y="380" class="sub">Key changes vs Hopper: accumulator moved to TMEM; FP4/FP6; tcgen05 async; CTA Pair for cross-SM operand sharing.</text>

  <rect x="20" y="394" width="840" height="334" rx="8" fill="url(#sm)" stroke="#4fc08a" stroke-width="1.5"/>
  <text x="440" y="418" class="box-lab" fill="#fff">Streaming Multiprocessor (SM) - Blackwell GB100</text>

